name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", "data/processed/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "data/processed/**", ".github/workflows/backend-ci.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        # Unit tests never call the LLM (budget-capped key); no secrets needed here.
        run: uv run pytest -q
