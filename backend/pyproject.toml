[project]
name = "series76-backend"
version = "0.1.0"
description = "Series 76 Technical Assistant: FastAPI + LangChain agent over the Series 76 electrical data tables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "av>=16,<17", # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which PyAV 19 rejects; 16.1 works
    "fastapi>=0.162.0",
    "faster-whisper>=1.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langfuse>=5.2.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
default-groups = ["dev", "ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
ingest = [
    "openai>=3.46.0",
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
]
